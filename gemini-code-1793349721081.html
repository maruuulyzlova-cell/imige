<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Анкета Клиента | Стилист Надежда Горбачева</title>

    <style>
        :root {
            --bg-main: #0B0B0B;
            --bg-card: #141414;
            --bg-input: #1C1C1C;
            --text-primary: #F5F5F3;
            --text-muted: #8E8E93;
            --accent-gold: #D4AF37;
            --accent-border: #2C2C2E;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Montserrat', -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-weight: 300;
            line-height: 1.5;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px 18px 120px 18px;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 10px 0 20px 0;
            border-bottom: 1px solid var(--accent-border);
            margin-bottom: 20px;
        }

        .brand-subtitle {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--accent-gold);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .brand-title {
            font-family: var(--font-serif);
            font-size: 28px;
            font-weight: 400;
            letter-spacing: 1.5px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .progress-container {
            margin-bottom: 25px;
        }

        .progress-bar {
            height: 2px;
            width: 100%;
            background: var(--accent-border);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 14.28%;
            background: var(--accent-gold);
            transition: width 0.4s ease;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .step-card {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .step-card.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 6px;
        }

        .section-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--accent-border);
            color: var(--text-primary);
            padding: 12px 14px;
            font-size: 14px;
            font-family: var(--font-sans);
            border-radius: 0;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: var(--accent-gold);
        }
